<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week10 POSSE課題</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 p-8">

  <div class="mx-auto max-w-2xl text-center flex flex-col items-center">
    <header class="mb-6">
      <h1 class="text-2xl font-bold text-slate-900">GitHubユーザー検索</h1>
      <p class="mt-1 text-sm text-slate-600">GitHubのユーザー名を入力して「検索」ボタンを押してください。</p>
    </header>

    <div class="flex gap-2 mb-4 w-full max-w-md">
      <input
        type="text"
        id="keyword"
        class="flex-1 rounded border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
        placeholder="GitHubユーザー名を入力"
        >
      <button
        id="searchBtn"
        class="bg-blue-500 hover:bg-blue-600 text-white font-medium px-4 py-2 rounded transition-colors disabled:opacity-50 disabled:cursor-not-allowed whitespace-nowrap">
        検索
      </button>
    </div>

    <p id="status" class="mb-4 text-sm text-slate-500 text-center">
      ユーザー名を入力して検索してください。
    </p>

    <ul id="postList" class="grid gap-3 w-full max-w-md"></ul>
  </div>

  <script>
    const keywordInput = document.getElementById("keyword");
    const searchBtn = document.getElementById("searchBtn");
    const status = document.getElementById("status");
    const userList = document.getElementById("postList");

    let allUsers = [];

    function render(users) {
      userList.innerHTML = "";
      users.forEach((user) => {

        const card = document.createElement("div");
        card.className = "bg-white rounded-lg shadow p-4 flex flex-col items-center text-center";

        const avatar = document.createElement("img");
        avatar.className = "w-20 h-20 rounded-full mb-3 shadow-sm"; 
        avatar.src = user.avatar_url; 
        avatar.alt = `${user.name || user.login}のアバター`;

        const name = document.createElement("h2");
        name.className = "text-lg font-bold text-slate-800";
        name.textContent = user.name || user.login; 

        const bio = document.createElement("p");
        bio.className = "text-sm text-slate-600 mt-1";
        bio.textContent = user.bio || "自己紹介はありません";

        const followers = document.createElement("p");
        followers.className = "text-gray-500 text-xs mt-2 bg-slate-100 px-3 py-1 rounded-full";
        followers.textContent = `フォロワー: ${user.followers} 人`;

        const repos = document.createElement("p");
        repos.className = "text-slate-400 text-xs mt-1";
        repos.textContent = `リポジトリ数: ${user.public_repos} 個`;

        const githubLink = document.createElement("a");
        githubLink.href = user.html_url;
        githubLink.target = "_blank";
        githubLink.rel = "noopener noreferrer";
        githubLink.className = "mt-3 text-xs text-blue-500 hover:underline";
        githubLink.textContent = "GitHubプロフィールを開く";

        card.appendChild(avatar);
        card.appendChild(name);
        card.appendChild(bio);
        card.appendChild(followers); 
        card.appendChild(repos);
        card.appendChild(githubLink);
        
        userList.appendChild(card);
      });
    }

    async function fetchPosts(){
      const username = keywordInput.value.trim();
      
      if (!username) {
        status.textContent = "ユーザー名を入力してください。";
        return;
      }

      status.textContent = "読み込み中...";
      userList.innerHTML = "";

      try{
        const response = await fetch(`https://api.github.com/users/${encodeURIComponent(username)}`);

        if(!response.ok){
          throw new Error("通信エラー " + response.status);
        }
    
        const data = await response.json();

        console.log("取得したGitHubデータ:", data);

        allUsers = [data];
        render(allUsers);

        status.textContent = "";
      }
      catch(error){
        console.error(error);
        status.textContent = "ユーザーが見つかりませんでした。";
        }
      }

    searchBtn.addEventListener("click", fetchPosts);

    keywordInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        fetchPosts();
      }
    });
  </script>
</body>
</html>
